<template id="time-picker-template">
    <div class="wk-date-picker" id="summary-date-picker">
        <div class="wk-date-controls">
            <a v-cloak v-show="canShift(-1)" :href="shiftLink(-1)" class="wk-period-step" title="Previous period" aria-label="Previous period"><span class="iconify" data-icon="akar-icons:chevron-left"></span></a>
            <button type="button" id="summary-date-trigger" class="wk-date-trigger" @click="toggle" :aria-expanded="open" aria-controls="summary-date-popover">
                <span class="iconify" data-icon="fa-regular:calendar-alt"></span>
                <span>${displayRange()}</span>
                <span class="iconify wk-chevron" data-icon="akar-icons:chevron-down"></span>
            </button>
            <a v-cloak v-show="canShift(1)" :href="shiftLink(1)" class="wk-period-step" title="Next period" aria-label="Next period"><span class="iconify" data-icon="akar-icons:chevron-right"></span></a>
        </div>
        <div class="wk-date-popover" :class="{'is-open': open}" id="summary-date-popover" :aria-hidden="!open">
            <div class="wk-date-presets">
                <span class="wk-popover-caption">Quick range</span>
                <a v-for="preset in presets" :key="preset.key" :href="intervalLink(preset.key)" :class="{'is-active': selectedInterval === preset.key}" :data-hotkey="preset.hotkey">
                    <span>${preset.label}</span><kbd>${preset.hotkey.toUpperCase()}</kbd>
                </a>
            </div>
            <form class="wk-custom-range" id="time-picker-form" @submit.prevent="onSubmit">
                <span class="wk-popover-caption">Custom range</span>
                <label for="from-date-picker">From</label>
                <input v-model="fromDate" id="from-date-picker" type="date" :max="customEndDate" required>
                <label for="to-date-picker">To</label>
                <input v-model="customEndDate" id="to-date-picker" type="date" :min="fromDate" required>
                <button type="submit" class="btn-primary">Apply range</button>
                <small>Dates use your Wakapi timezone.</small>
            </form>
        </div>
    </div>
</template>
